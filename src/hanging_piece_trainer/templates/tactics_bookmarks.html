<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hanging Piece Trainer · Bookmarked</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='packages.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tactics_bookmarks.css') }}">
    <script src="{{ url_for('static', filename='pieces.js') }}" defer></script>
    <script src="{{ url_for('static', filename='tactics_bookmarks.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>Bookmarked</h1>
        {% set current = "tactics" %}
        {% include "_site_header_nav.html" %}
      </div>
      <div class="stats" aria-label="Overview">
        <div class="cell primary">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          </span>
          <div class="body"><span class="value" id="bookmark-count">—</span><span class="label">Bookmarks</span></div>
        </div>
        <div class="cell">
          <a href="{{ url_for('tactics_packages_page') }}" class="cta-link">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15 6l-6 6 6 6"/></svg>
            Back to packages
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="panel">
        <p class="muted intro">
          Puzzles you've flagged during training. Tag any bookmark with space-separated words to filter here.
        </p>
        <div class="bookmark-controls">
          <label class="filter-label" for="filter-input">Filter</label>
          <input id="filter-input" type="search" placeholder="Type a tag to narrow the list" autocomplete="off">
          <div id="tag-chips" class="tag-chip-row" aria-label="All tags"></div>
        </div>
        <div id="bookmark-list" class="bookmark-grid" aria-live="polite">
          <p class="muted">Loading bookmarks…</p>
        </div>
      </section>
    </main>

    <dialog id="edit-dialog" class="config-dialog">
      <form method="dialog">
        <h2>Edit tags</h2>
        <label class="bookmark-field">
          <span>Tags</span>
          <input type="text" id="edit-tags" autocomplete="off" spellcheck="false" placeholder="endgame rook trap">
        </label>
        <p class="muted">Space-separated. Empty removes all tags.</p>
        <p id="edit-error" class="bookmark-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="edit-cancel" class="dialog-btn">Cancel</button>
          <button type="submit" id="edit-save" class="dialog-btn dialog-btn-primary">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
