<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hanging Piece Trainer · Tactics Stats</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tactics_stats.css') }}">
    <script src="{{ url_for('static', filename='tactics_stats.js') }}" defer></script>
  </head>
  <body data-slug="{{ slug }}">
    <header class="site-header">
      <div>
        <h1>Tactics · Batch history</h1>
        <nav class="nav-pills" aria-label="Sections">
          <a href="{{ url_for('index') }}">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5zm0 7L3 15l9 5 9-5-9-5z"/></svg>
            Hanging trainer
          </a>
          <a href="{{ url_for('tactics_packages_page') }}" class="current" aria-current="page">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6 6.6.6-5 4.4 1.5 6.5L12 16.9l-6 3.6 1.5-6.5-5-4.4L9.1 8z"/></svg>
            Tactics
          </a>
          <a href="{{ url_for('minigame') }}">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>
            Mini game
          </a>
          <a href="{{ url_for('pawn_page') }}">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a3 3 0 0 0-2 5.2C8.8 8 8 9.2 8 10.5c0 1.1.6 2.1 1.5 2.7L8 21h8l-1.5-7.8A3.3 3.3 0 0 0 16 10.5c0-1.3-.8-2.5-2-3.3A3 3 0 0 0 12 2z"/></svg>
            Pawn war
          </a>
        </nav>
      </div>
      <div class="stats" aria-label="Aggregate">
        <div class="cell primary">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6 6.6.6-5 4.4 1.5 6.5L12 16.9l-6 3.6 1.5-6.5-5-4.4L9.1 8z"/></svg>
          </span>
          <div class="body"><span class="value" id="total-earned">0</span><span class="label">Total earned</span></div>
        </div>
        <div class="cell">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v3H4zm0 5h16v3H4zm0 5h16v3H4z"/></svg>
          </span>
          <div class="body"><span class="value" id="total-batches">0</span><span class="label">Batches</span></div>
        </div>
        <div class="cell">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9h-9V3z"/></svg>
          </span>
          <div class="body"><span class="value" id="average-earned">0</span><span class="label">Avg / batch</span></div>
        </div>
        <div class="cell">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 8h8l-6.5 4.7L18.5 22 12 17.3 5.5 22l2-7.3L1 10h8z"/></svg>
          </span>
          <div class="body"><span class="value" id="best-batch">0</span><span class="label">Best batch</span></div>
        </div>
        <div class="cell">
          <a class="value stats-link" href="{{ url_for('tactics_play_page', slug=slug) }}" style="text-decoration:none;font:800 1.05rem/1 'IBM Plex Mono',ui-monospace,monospace;color:#fff">← Back</a>
          <span class="label" style="opacity:0">.</span>
        </div>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="chart-title">
        <h2 id="chart-title">Points per batch over time</h2>
        <div id="chart-wrap">
          <svg id="chart" viewBox="0 0 800 240" preserveAspectRatio="none" role="img" aria-label="Batch score chart"></svg>
          <p id="chart-empty" class="muted" hidden>Play a full batch on the Tactics page to see your first data point.</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="table-title">
        <h2 id="table-title">Batches</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Cycle</th>
                <th>Completed</th>
                <th>Points</th>
                <th>Clean solves</th>
                <th>Per-puzzle</th>
              </tr>
            </thead>
            <tbody id="batch-rows">
              <tr><td colspan="6" class="muted">No batches yet.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
